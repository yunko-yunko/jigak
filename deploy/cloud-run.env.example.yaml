# Copy to cloud-run.env.yaml and replace every REPLACE_* value.
# Non-secret values only. Secret bindings are configured by cloud-run.ps1.
# KAKAO_REST_API_KEY and the spare KAKAO_REST_API_KEY_FALLBACK are secrets: bind them with SecretBindings, never list them here.
# So are DATA_GO_KR_SERVICE_KEY_FALLBACK and SEOUL_OPEN_API_KEY_FALLBACK (spare keys for spent daily quotas).
# DATA_GO_KR_DAILY_LIMIT (bus calls per operation and key a day, default 1000) is not a secret and may be set here.
# PORT is reserved and supplied automatically by Cloud Run via --port 8080.
NODE_ENV: 'production'
# Cloud Run's front end is one proxy hop: with 0, every client shares the proxy's address in the rate limits.
TRUST_PROXY_HOPS: '1'
HOST: '0.0.0.0'
DB_HOST: '/cloudsql/REPLACE_PROJECT_ID:asia-northeast3:REPLACE_SQL_INSTANCE'
DB_PORT: '5432'
DB_NAME: 'jigakmap'
DB_USER: 'jigakmap'
DB_SSL: 'false'
DB_POOL_MAX: '5'
CORS_ORIGINS: 'https://REPLACE_FRONTEND_DOMAIN'
AUTH_PUBLIC_BASE_URL: 'https://REPLACE_API_DOMAIN'
AUTH_WEB_RETURN_URL: 'https://REPLACE_FRONTEND_DOMAIN/'
PEDESTRIAN_ROUTING_ENABLED: 'true'
PEDESTRIAN_OSRM_URL: ''
PEDESTRIAN_USER_AGENT: ''
BICYCLE_ROUTING_ENABLED: 'true'
BICYCLE_OSRM_URL: ''
ROUTE_INTERMEDIATE_HUBS: '2'
ROUTE_CALL_LIMIT: '72'
ROUTE_METRICS_ENABLED: 'false'
MOBILITY_GBFS_FEEDS: ''
# 시연용 가상 킥보드·전기자전거(실제 운영사 아님). 'scooter', 'ebike' 또는 'scooter,ebike'로 켭니다. 빈 값은 꺼짐입니다.
# 대수는 빈 값이면 서울 실제 등록 대수(킥보드 14933, 함께 켜면 전기자전거 52605 추가)이며 Cloud Run에서도 자르지 않습니다.
# 켜면 cloud-run.ps1이 --cpu 2, --memory 2Gi, --no-cpu-throttling, --min-instances 1과 /api/health/ready startup probe로 배포합니다.
MOBILITY_SIMULATION: ''
MOBILITY_SIMULATION_FLEET: ''
MOBILITY_SIMULATION_EBIKE_FLEET: ''
MOBILITY_SIMULATION_SEED: 'jigak'
# 계산한 하루치 창을 저장해 재시작·배포·확장 때 다시 계산하지 않습니다. cloud-run.ps1 -SimulationWindowBucket(서울 asia-northeast3 버킷)과 함께 '/sim-windows'로 둡니다. 빈 값은 저장 안 함.
MOBILITY_SIMULATION_WINDOW_DIR: ''
# 'false'면 /api/health/ready가 오늘 창을 기다리지 않고 DB만 확인합니다. 빈 값은 'true'입니다.
MOBILITY_SIMULATION_READY_GATE: ''
# 빈 값은 저장소의 OSM 기반 유동인구 가중치입니다. NGII 기반 파일은 국외 반출 금지라 서울(asia-northeast3) 서비스에서 서울 리전 버킷 볼륨의 절대 경로로만 씁니다(예: '/models/shared-mobility-foot-weights-ngii-v1.json'). 읽지 못하면 시작하지 않습니다.
MOBILITY_FOOT_WEIGHTS_PATH: ''
# NGII 1:1,000 지도(seoul-ngii-v1.pmtiles)를 이 API가 Range 요청으로만 내려줍니다(/api/maps/seoul-ngii-v1.pmtiles).
# cloud-run.ps1 -MapBucket(서울 asia-northeast3 비공개 버킷)을 읽기 전용 /maps로 붙일 때만 '/maps/seoul-ngii-v1.pmtiles'입니다.
# 빈 값이면 그 주소가 404이고 앱의 NGII 층은 꺼집니다. 국외 반출 금지 자료라 공개 버킷·다른 리전·CDN에 두지 않습니다.
MAP_NGII_PMTILES_PATH: ''
KAKAO_LOGIN_OIDC: 'false'
# 모델 갱신 Job의 버킷을 cloud-run.ps1 -ModelBucket으로 읽기 전용 /models에 붙일 때만 '/models/manifest.json'입니다(그때 이 값이 꼭 있어야 합니다).
# 빈 값이면 아래 ETA_*_PATH 고정 경로 방식입니다. 설정하면 ETA_*_PATH는 manifest에 없는 모델의 대체 경로로만 쓰입니다.
MODEL_MANIFEST_PATH: ''
MODEL_MANIFEST_POLL_SECONDS: ''
MODEL_REFRESH_STATUS_PATH: ''
MODEL_REFRESH_SCHEDULE_KST: ''
ETA_MODEL_PATH: ''
ETA_PUBLIC_BUS_MODEL_PATH: ''
ETA_SPATIAL_BUS_MODEL_PATH: ''
ETA_RAIL_GATE_MODEL_PATH: ''
ETA_PUBLIC_BICYCLE_SHADOW_DIRECTORY: ''
# cloud-models/를 읽기 전용 볼륨(예: Cloud Storage 버킷 마운트 /models)으로 붙인 경우의 경로입니다.
BICYCLE_RIDE_TIMES_PATH: ''
ETA_SPATIAL_BICYCLE_MODEL_PATH: ''
ETA_HGB_MODEL_PATH: ''
OPENAI_MODEL: ''
